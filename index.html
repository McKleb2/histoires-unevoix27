<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histoires où tu décides</title>
<meta name="description" content="Des histoires interactives avec voix off : à chaque étape, deux choix, quatre fins, et un verset biblique.">
<link rel="icon" href="commun/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--papier:#f4ecdc;--doux:#a9a596;--encre:#1a1206;--bg:#0b1120;--accent:#f2a93b;--display:"Fraunces",Georgia,serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--papier);font-family:var(--body);line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-direction:column;align-items:flex-start;gap:28px;padding:8px 0 32px}
.logo img{display:block;width:180px;height:auto}
.kicker{margin:0 0 .6rem;font-size:.8125rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.05}
h1 em{font-weight:400;color:var(--accent)}
.intro{margin:1rem 0 0;max-width:36rem;color:var(--doux);font-size:1.0625rem}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{display:block;height:100%;color:inherit;text-decoration:none;border-radius:18px;overflow:hidden;background:rgba(244,236,220,.05);border:1.5px solid rgba(244,236,220,.1);transition:transform .2s,border-color .2s}
a.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.card svg,.soon-art{display:block;width:100%;height:auto;aspect-ratio:390/300}
.soon{border-style:dashed}
.soon-art{display:flex;align-items:center;justify-content:center;background:rgba(244,236,220,.03)}
.soon-art span{font-family:var(--display);font-size:4rem;color:var(--accent);opacity:.6}
.sky{fill:var(--sky)} .a{fill:var(--accent)} .as{stroke:var(--accent)} .stop{stop-color:var(--accent)}
.meta{display:flex;flex-direction:column;gap:2px;padding:14px 16px 16px}
.num{font-size:.75rem;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.t{font-family:var(--display);font-size:1.35rem;font-weight:600;line-height:1.2}
.th{color:var(--doux);font-size:.9375rem}
footer{margin-top:48px;display:flex;justify-content:center}
footer img{width:min(280px,70%);height:auto;opacity:.9}
@media (prefers-reduced-motion:reduce){.card{transition:none}a.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo"><img src="commun/logo.png" alt="UneVoix27" width="228" height="56"></span>
    <div>
      <p class="kicker">1 histoire où tu décides</p>
      <h1>Tu es le <em>héros</em>.</h1>
      <p class="intro">À chaque étape, deux choix. Quatre fins possibles, et chacune t’apprend quelque chose. Avec voix off et musique.</p>
    </div>
  </header>
  <main>
  <ul>
    <li><a class="card" href="le-portefeuille/">
      <svg viewBox="0 0 390 300" aria-hidden="true" style="--sky:#0e1730;--accent:#f2a93b"><defs><radialGradient id="g-le-portefeuille"><stop offset="0" class="stop" stop-opacity=".55"/><stop offset="1" class="stop" stop-opacity="0"/></radialGradient></defs><rect width="390" height="300" class="sky"/><g fill="#f4ecdc"><circle cx="40" cy="40" r="1.4" opacity=".6"/><circle cx="120" cy="24" r="1" opacity=".5"/><circle cx="200" cy="58" r="1.2" opacity=".4"/><circle cx="90" cy="84" r=".9" opacity=".5"/><circle cx="360" cy="30" r="1.1" opacity=".4"/></g><circle cx="296" cy="96" r="150" fill="url(#g-le-portefeuille)"/><polygon points="286,104 306,104 380,292 212,292" class="a" opacity=".10"/><rect y="288" width="390" height="12" fill="#1a2030"/><rect x="292" y="96" width="7" height="196" fill="#2a3244"/><path d="M278 98h36l-8-12h-20z" fill="#2a3244"/><circle cx="296" cy="102" r="6" class="a"/><g fill="#2f384c"><rect x="40" y="120" width="186" height="8" rx="2"/><rect x="46" y="128" width="4" height="160"/><rect x="216" y="128" width="4" height="160"/><rect x="18" y="140" width="3" height="148"/></g><rect x="50" y="132" width="166" height="96" fill="#f4ecdc" fill-opacity=".04" stroke="#3a4458" stroke-width="1.5"/><g fill="#3a4458"><rect x="66" y="242" width="134" height="7" rx="2"/><rect x="76" y="249" width="4" height="39"/><rect x="186" y="249" width="4" height="39"/></g><rect x="146" y="228" width="34" height="14" rx="3" class="a"/><rect x="146" y="233" width="34" height="2" fill="#1a1206" opacity=".35"/><circle cx="19.5" cy="134" r="11" fill="none" stroke="#5fc0b2" stroke-width="2.5"/><text x="19.5" y="138.5" text-anchor="middle" font-size="12" font-weight="700" fill="#5fc0b2" font-family="sans-serif">B</text></svg>
      <span class="meta"><span class="num">01</span><span class="t">Le Portefeuille</span><span class="th">L’honnêteté</span></span>
    </a></li>
    <li><div class="card soon">
      <div class="soon-art"><span>?</span></div>
      <span class="meta"><span class="num">BIENTÔT</span><span class="t">Prochaine histoire</span><span class="th">Reviens vite pour la découvrir.</span></span>
    </div></li>
  </ul>
  </main>
  <footer><img src="commun/logo-eglise.png" alt="Église adventiste du septième jour" width="560" height="346"></footer>
</div>
</body>
</html>
