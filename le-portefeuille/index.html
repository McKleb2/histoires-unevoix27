<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Portefeuille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Direction « Lampadaire » : une seule lumière qui change de teinte selon l'humeur de la scène.
   Colonne étroite, pensée pour être filmée en vertical. La page est volontairement sombre dans les deux thèmes. */
:root{
  --papier:#f4ecdc;
  --doux:#a9a596;
  --encre:#1a1206;
  --bg:#0b1120;
  --sky:#0e1730;
  --accent:#f2a93b;
  --lesson-ink:#8a5a0a;
  --display:Fraunces,Georgia,"Times New Roman",serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ color-scheme:dark } }
:root[data-theme="dark"]{ color-scheme:dark }
body[data-mood="nuit"]{--bg:#0b1120;--sky:#0e1730;--accent:#f2a93b}
body[data-mood="ombre"]{--bg:#150d0b;--sky:#1d1210;--accent:#e8714f;--lesson-ink:#a3401f}
body[data-mood="jour"]{--bg:#13110b;--sky:#1c1810;--accent:#f2b441}
body[data-mood="lumiere"]{--bg:#14110a;--sky:#201a0e;--accent:#f6c453}

*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--papier);font-family:var(--body);font-size:1rem;-webkit-text-size-adjust:100%;transition:background-color .5s}
.wrap{width:100%;max-width:30rem;margin:0 auto}

.hero{position:relative;overflow:hidden;aspect-ratio:390/300}
.hero svg.ill{display:block;width:100%;height:100%}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:37%;background:linear-gradient(180deg,transparent,var(--bg));pointer-events:none}
.sky{fill:var(--sky)}
.a{fill:var(--accent)}
.as{stroke:var(--accent)}
.stop{stop-color:var(--accent)}

.top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:1rem 1.25rem}
.logo{display:block;padding:.3rem .75rem;background:var(--papier);border-radius:999px}
.logo img{display:block;height:1.65rem;width:auto}
.toggles{display:flex;gap:.5rem}
.tog{display:flex;align-items:center;gap:.4rem;min-height:44px;padding:0 .9rem;font:inherit;font-size:.875rem;font-weight:700;color:var(--papier);background:rgba(12,17,28,.55);border:1.5px solid rgba(244,236,220,.28);border-radius:999px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tog[aria-pressed="false"]{color:var(--doux);border-style:dashed;text-decoration:line-through}
.tog svg{width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{position:relative;z-index:1;padding:0 1.5rem 2.5rem;margin-top:-2.5rem}
.scene{animation:rise .45s ease-out both}
@keyframes rise{from{opacity:.3;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.scene{animation:none}body{transition:none}}

.dots{display:flex;gap:6px;margin:0 0 1.15rem;padding:0;list-style:none}
.dots li{flex:1;height:4px;border-radius:2px;background:rgba(244,236,220,.16);transition:background-color .4s}
.dots li.on{background:var(--accent)}

.kicker{margin:0 0 .75rem;font-size:.8125rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.where{margin:-.5rem 0 1.1rem;font-family:var(--display);font-style:italic;font-size:1.5rem}
h1,h2{font-family:var(--display);font-weight:600;margin:0 0 1.1rem;text-wrap:balance}
h1{font-size:clamp(2.8rem,13vw,3.4rem);line-height:1;letter-spacing:-.02em}
h1 em{font-weight:400;color:var(--accent)}
h2{font-size:clamp(1.9rem,8.5vw,2.25rem);line-height:1.05;letter-spacing:-.01em}
.story p{margin:0 0 .9rem;font-size:1.125rem;line-height:1.55;max-width:65ch}
.label{margin:1.6rem 0 .75rem;font-size:.8125rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--doux)}

.choices{display:flex;flex-direction:column;gap:.75rem}
.choice{display:flex;gap:.9rem;align-items:flex-start;width:100%;padding:1rem;text-align:left;font:inherit;font-size:1.0625rem;line-height:1.4;color:var(--papier);background:rgba(244,236,220,.06);border:1.5px solid rgba(244,236,220,.18);border-radius:16px;cursor:pointer;transition:border-color .2s,background-color .2s}
.choice:hover{border-color:var(--accent);background:rgba(244,236,220,.1)}
.choice:active{transform:scale(.99)}
.choice span:last-child{padding-top:.3rem}
.letter{flex:none;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;font-family:var(--display);font-size:1.125rem;font-weight:600;color:var(--encre);background:var(--accent)}

.btn{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;min-height:54px;padding:0 1.2rem;font:inherit;font-size:1.0625rem;font-weight:700;color:var(--encre);background:var(--accent);border:1.5px solid var(--accent);border-radius:16px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
a.btn{text-decoration:none;box-sizing:border-box}
.btn.ghost{color:var(--papier);background:transparent;border-color:rgba(244,236,220,.35)}
.btn.ghost:hover{border-color:var(--accent)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.actions{display:flex;flex-direction:column;gap:.65rem;margin-top:1.5rem}
.choice:focus-visible,.btn:focus-visible,.tog:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:1.4rem 0 .6rem;padding:0;list-style:none}
.tiles li{display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;font-family:var(--display);font-size:1.25rem;border:1.5px dashed rgba(244,236,220,.28);color:var(--doux)}
.tiles li.on{border:0;background:var(--accent);color:var(--encre)}
.count{margin:0 0 1.5rem;font-size:.875rem;color:var(--doux)}

.badge{display:inline-block;margin:0 0 .9rem;padding:.35rem .75rem;font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--encre);background:var(--accent);border-radius:999px}
.lesson{margin:1.5rem 0 0;padding:1.35rem 1.25rem;background:var(--papier);color:#1c1710;border-radius:20px}
.lesson-label{margin:0 0 .5rem;font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--lesson-ink)}
.lesson-text{margin:0 0 1rem;font-size:1.0625rem;line-height:1.45;font-weight:700}
.verse{padding-top:.9rem;border-top:1px solid rgba(28,23,16,.18)}
.verse p{margin:0;font-family:var(--display);font-style:italic;font-size:1.25rem;line-height:1.35}
.verse .ref{margin:.4rem 0 .6rem;font-family:var(--body);font-style:normal;font-size:.875rem;font-weight:700;color:#5a5243}

.tracker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.tracker li{display:flex;flex-direction:column;gap:4px;min-height:74px;padding:.75rem;border-radius:14px;border:1.5px dashed rgba(244,236,220,.22);color:var(--doux)}
.tracker li.on{border:1.5px solid var(--accent);background:rgba(244,236,220,.08);color:var(--papier)}
.tracker .n{font-size:.75rem;font-weight:700;letter-spacing:.1em;color:var(--doux)}
.tracker .t{font-family:var(--display);font-size:.95rem;line-height:1.2}
.foot{margin:1.4rem 0 0;font-size:.8125rem;color:var(--doux)}

.sign{display:flex;flex-direction:column;align-items:center;gap:.9rem;margin:0 1.5rem;padding:1.6rem 0 2.2rem;border-top:1px solid rgba(244,236,220,.12)}
.sign img{display:block;width:132px;height:auto;opacity:.82}
</style>
</head>

var state = { scene:"intro", found:[] };

function loadFound(){
  try{
    var raw = localStorage.getItem("portefeuille-fins");
    if(raw){ var arr = JSON.parse(raw); if(Array.isArray(arr)) return arr; }
  }catch(e){}
  return [];
}
function saveFound(){
  try{ localStorage.setItem("portefeuille-fins", JSON.stringify(state.found)); }catch(e){}
}

var ill = document.getElementById("ill");
var currentIll = null;
var ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

function paras(list){ return list.map(function(t){ return "<p>" + t + "</p>"; }).join(""); }

function render(){
  var sc = SCENES[state.scene];
  document.body.setAttribute("data-mood", sc.mood || "nuit");
  if(currentIll !== sc.ill){
    ill.innerHTML = '<svg class="ill" viewBox="0 0 390 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + ILL[sc.ill] + '</svg>';
    currentIll = sc.ill;
  }
  var n = state.found.length;
  var depth = sc.ending ? 4 : DEPTH[state.scene];
  var html = '<section class="scene">';
  html += '<ol class="dots" aria-label="Progression : étape ' + depth + ' sur 4">';
  for(var i = 0; i < 4; i++){ html += '<li class="' + (i < depth ? 'on' : '') + '"></li>'; }
  html += '</ol>';

  if(state.scene === "intro"){
    html += '<p class="kicker">Une histoire où tu décides</p>';
    html += '<h1>Le<br><em>Portefeuille</em></h1>';
    html += '<div class="story"><p>Tu es le héros. À chaque étape, deux choix. Ce que tu choisis change la suite, et la fin.</p></div>';
    html += '<ul class="tiles" aria-label="Fins découvertes">';
    ENDINGS.forEach(function(id, i){
      var on = state.found.indexOf(id) !== -1;
      html += '<li class="' + (on ? 'on' : '') + '" aria-label="Fin ' + (i + 1) + (on ? ' : ' + ENDING_TITLES[id] : ' : pas encore trouvée') + '">' + (i + 1) + '</li>';
    });
    html += '</ul>';
    html += '<p class="count">' + (n ? n + ' fin' + (n > 1 ? 's' : '') + ' sur 4 déjà trouvée' + (n > 1 ? 's' : '') + '.' : 'Quatre fins possibles. Chacune t’apprend quelque chose.') + '</p>';
    html += '<button class="btn" type="button" data-to="start">Commencer ' + ARROW + '</button>';
  } else if(sc.ending){
    html += '<p class="badge">Fin ' + (ENDINGS.indexOf(sc.ending) + 1) + ' sur 4</p>';
    html += '<h2>' + sc.title + '</h2>';
    html += '<div class="story">' + paras(sc.text) + '</div>';
    html += '<div class="lesson"><p class="lesson-label">La leçon</p><p class="lesson-text">' + sc.lesson + '</p>';
    sc.verses.forEach(function(v){
      html += '<div class="verse"><p>« ' + v.text + ' »</p><p class="ref">' + v.ref + '</p></div>';
    });
    html += '</div>';
    html += '<p class="label">Tes fins · ' + n + '/4</p>';
    html += '<ul class="tracker" aria-label="Fins découvertes">';
    ENDINGS.forEach(function(id, i){
      var on = state.found.indexOf(id) !== -1;
      html += '<li class="' + (on ? 'on' : '') + '"><span class="n">FIN ' + (i + 1) + '</span><span class="t">' + (on ? ENDING_TITLES[id] : '? ? ?') + '</span></li>';
    });
    html += '</ul>';
    html += '<p class="count" style="margin:.7rem 0 0">' + (n >= 4 ? 'Tu as trouvé les 4 fins.' : 'Il te reste ' + (4 - n) + ' fin' + (4 - n > 1 ? 's' : '') + ' à découvrir.') + '</p>';
    html += '<div class="actions">';
    if(sc.cta){ html += '<button class="btn" type="button" data-to="' + sc.cta.to + '">' + sc.cta.label + '</button>'; }
    html += '<button class="btn' + (sc.cta ? ' ghost' : '') + '" type="button" data-to="start">Rejouer, autre chemin</button>';
    html += '<a class="btn ghost" href="../">Voir les autres histoires</a>';
    html += '</div>';
    html += '<p class="foot">Versets : traduction Louis Segond (1910).</p>';
  } else {
    html += '<p class="kicker">' + sc.when + '</p>';
    html += '<p class="where">' + sc.where + '</p>';
    html += '<div class="story">' + paras(sc.text) + '</div>';
    html += '<p class="label">Que fais-tu ?</p>';
    html += '<div class="choices">';
    sc.choices.forEach(function(c, i){
      html += '<button class="choice" type="button" data-to="' + c.to + '"><span class="letter">' + (i === 0 ? 'A' : 'B') + '</span><span>' + c.label + '</span></button>';
    });
    html += '</div>';
  }

  html += '</section>';
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ===== SON : musique de fond + voix off des textes (pas des choix) ===== */
var music = new Audio("../commun/musique.mp3");
music.loop = true;
var MUSIC_VOL = 0.30, MUSIC_DUCK = 0.10;
music.volume = MUSIC_VOL;
var voice = null;
var sound = { music:true, voice:true, hasVoice:false };

function safePlay(a){
  try{ var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
}
function startMusic(){ if(sound.music) safePlay(music); }
function stopVoice(){
  if(voice){ try{ voice.pause(); }catch(e){} voice = null; }
  music.volume = MUSIC_VOL;
}
function playVoice(id){
  stopVoice();
  if(!sound.voice || !sound.hasVoice || id === "intro") return;
  var a = new Audio("audio/vo-" + id + ".mp3");
  a.addEventListener("play", function(){ music.volume = MUSIC_DUCK; });
  a.addEventListener("ended", function(){ if(voice === a){ voice = null; music.volume = MUSIC_VOL; } });
  a.addEventListener("error", function(){ if(voice === a){ voice = null; music.volume = MUSIC_VOL; } });
  voice = a;
  safePlay(a);
}

var togMusic = document.getElementById("tog-music");
var togVoice = document.getElementById("tog-voice");
togMusic.addEventListener("click", function(){
  sound.music = !sound.music;
  togMusic.setAttribute("aria-pressed", String(sound.music));
  if(sound.music) safePlay(music); else music.pause();
});
togVoice.addEventListener("click", function(){
  sound.voice = !sound.voice;
  togVoice.setAttribute("aria-pressed", String(sound.voice));
  if(sound.voice) playVoice(state.scene); else stopVoice();
});

/* La voix off n'apparaît que si les fichiers audio sont bien présents. */
try{
  fetch("audio/vo-start.mp3", { method:"HEAD" }).then(function(r){
    if(r.ok){ sound.hasVoice = true; togVoice.hidden = false; }
  }).catch(function(){});
}catch(e){}

function go(id){
  if(!SCENES[id]) return;
  state.scene = id;
  var sc = SCENES[id];
  if(sc.ending && state.found.indexOf(sc.ending) === -1){
    state.found.push(sc.ending);
    saveFound();
  }
  render();
  startMusic();
  playVoice(id);
}

app.addEventListener("click", function(e){
  var el = e.target.closest("[data-to]");
  if(el) go(el.getAttribute("data-to"));
});

/* ===== DÉMARRAGE ===== */
function start(saved){
  state.found = loadFound();
  if(saved && saved.found){
    saved.found.forEach(function(id){ if(state.found.indexOf(id) === -1) state.found.push(id); });
  }
  if(saved && saved.scene && SCENES[saved.scene]) state.scene = saved.scene;
  render();
}
if(window.claude && window.claude.hot){
  if(window.claude.hot.snapshot){ window.claude.hot.snapshot(function(){ return { scene:state.scene, found:state.found }; }); }
  if(window.claude.hot.ready){ window.claude.hot.ready(start); } else { start(window.claude.hot.data || {}); }
} else {
  start({});
}
</script>
</body>
</html>
